<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>

Contact — Editors For You

</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:
linear-gradient(
135deg,
#050505,
#0f1812
);

font-family:
Inter;

color:
white;

overflow:hidden;

}

/* NAV */

nav{

position:fixed;

top:0;
left:0;
right:0;

padding:
24px 6vw;

display:flex;

justify-content:
space-between;

background:
rgba(
5,
5,
5,
.45
);

backdrop-filter:
blur(
18px
);

border-bottom:
1px solid rgba(
26,
255,
122,
.12
);

}

nav b{

color:
#1aff7a;

}

/* HERO */

.hero{

min-height:
100vh;

display:flex;

justify-content:center;

align-items:center;

padding:
100px 20px;

}

.form-box{

width:
100%;

max-width:
700px;

background:
rgba(
20,
20,
20,
.75
);

padding:
50px;

border-radius:
30px;

backdrop-filter:
blur(
20px
);

border:
1px solid rgba(
26,
255,
122,
.08
);

box-shadow:
0 30px 80px rgba(
0,
0,
0,
.4
);

}

h1{

font-family:
'Playfair Display';

font-size:
4rem;

color:
#1aff7a;

margin-bottom:
20px;

text-shadow:
0 0 25px rgba(
26,
255,
122,
.12
);

}

.subtitle{

color:
#aaa;

margin-bottom:
40px;

}

/* INPUTS */

input,
select,
textarea{

width:
100%;

padding:
18px;

margin:
12px 0;

background:
rgba(
25,
25,
25,
.9
);

border:
1px solid rgba(
26,
255,
122,
.08
);

border-radius:
14px;

color:
white;

font-size:
1rem;

}

textarea{

height:
150px;

resize:none;

}

input:focus,
select:focus,
textarea:focus{

outline:none;

border-color:
#1aff7a;

box-shadow:
0 0 20px rgba(
26,
255,
122,
.12
);

}

/* BUTTON */

button{

width:
100%;

padding:
18px;

margin-top:
20px;

border:none;

border-radius:
40px;

font-size:
1rem;

font-weight:
700;

background:
linear-gradient(
135deg,
#1aff7a,
#0bd95f
);

cursor:pointer;

transition:
.3s;

}

button:hover{

transform:
translateY(
-4px
);

}

</style>

</head>

<body>

<nav>

<b>

EDITORS FOR YOU

</b>

</nav>


<section class="hero">

<div class="form-box">

<h1>

Start Your Story.

</h1>

<p class="subtitle">

Tell us your vision.
We'll turn it into emotion.

</p>


<form
action="https://formsubmit.co/editorsforyouagency@gmail.com"
method="POST">


<input
type="text"
name="name"
placeholder="Full Name"
required>


<input
type="email"
name="email"
placeholder="Email Address"
required>


<input
type="tel"
name="phone"
placeholder="Phone Number">


<select
name="category">

<option>

Choose Category

</option>

<option>

Transformation

</option>

<option>

Creator

</option>

<option>

Trips

</option>

<option>

Anniversary

</option>

<option>

Baby Shower

</option>

<option>

Social Media

</option>

</select>


<textarea
name="project"
placeholder="Describe your project...">

</textarea>


<input
type="hidden"
name="_subject"
value="New Editors For You Client">


<input
type="hidden"
name="_next"
value="thankyou.html">


<button>

Submit Project

</button>

</form>

</div>

</section>

</body>

</html>
